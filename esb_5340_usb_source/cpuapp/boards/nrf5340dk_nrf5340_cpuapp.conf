# nrf5340dk_nrf5340_cpuapp.conf
# Board-spezifische Konfiguration für nRF5340 DK v2.0

# USB auf dem nRF5340 DK
CONFIG_USB_DEVICE_DRIVER_INIT_PRIORITY=90

# DCDC Regler aktivieren (empfohlen für nRF5340 DK v2.0)
CONFIG_BOARD_ENABLE_DCDC_APP=y
CONFIG_BOARD_ENABLE_DCDC_NET=y
CONFIG_BOARD_ENABLE_CPUNET=y
